# Number of the open "Release Status per Platform, Version & Binary Type" issue
# that the "Update Release Status Tables" workflow keeps in sync with status.csv.
# Leave blank between releases and the workflow does nothing.
issue=

# Repository holding the "Triage Automated Tests for <Month> <Year> JDK<N> - <platform>" issues
# used to derive AQAstatus and TCKstatus (the <Month> <Year> comes from the status issue title).
aqaRepo=adoptium/aqa-tests

# Release plan listing the release tags of the cycle (jdk<N>uGA="jdk-<version>-ga"). Overrides the Version column
# of status.csv for the JDK versions it lists.
releasePlanUrl=https://raw.githubusercontent.com/adoptium/mirror-scripts/master/releasePlan.cfg
